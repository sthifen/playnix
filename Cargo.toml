[package]
name = "playnix"
version = "0.3.4"
edition = "2024"
description = "Google Play y apps de Android integradas en Linux (sobre Waydroid)"
license = "GPL-3.0-or-later"
repository = "https://github.com/sthifen/playnix"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
async-channel = "2.5.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
pangocairo = "0.22"
serde_json = "1"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
